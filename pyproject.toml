[project]
name = "voice-swap"
version = "0.2.0"
description = "AI singing voice conversion - use your voice to cover songs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scipy>=1.10.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "resampy>=0.4.2",
    "praat-parselmouth>=0.4.3",
    "pyworld>=0.3.0",
    "faiss-cpu>=1.7.4",
    "demucs>=4.0.0",
]

[project.scripts]
voice-swap = "voice_swap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_swap"]
